[package]
name = "strategy-ci-core"
description = "Data-driven core of Wickra Strategy-CI: golden-pin a strategy's backtest report, assert tolerances and invariant properties, and fuzz-test against seeded data perturbations."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

# docs.rs builds with every feature on, so the rayon-backed `parallel` path
# appears in the rendered documentation rather than being invisible to anyone
# reading it.
[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[features]
# `parallel` runs a suite's tests concurrently with rayon; it is on by default.
# The wasm binding builds with --no-default-features for a sequential run that is
# byte-identical to the parallel one.
#
# There is deliberately no `proof` feature yet. The verifiable report hash is a
# ROADMAP "Next" item and it needs wickra-proof's `proof-core`, which has no
# crates.io release -- declaring the dependency, even as an optional one, makes
# this crate unpublishable, because `cargo publish` resolves optional
# dependencies too. It returns when that crate ships.
default = ["parallel"]
parallel = ["dep:rayon"]

[dependencies]
# The backtest engine under test: strategy-ci forwards the opaque StrategySpec
# JSON to its run_json and golden-pins the returned BacktestReport.
wickra-backtest-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Deterministic PRNG for the fuzz-data generator (seeded; never thread_rng).
rand.workspace = true
rand_pcg.workspace = true
# Data-parallel suite execution; optional (the `parallel` feature).
rayon = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
serde.workspace = true
serde_json.workspace = true

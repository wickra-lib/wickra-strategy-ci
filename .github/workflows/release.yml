name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Least-privilege default for the auto-injected GITHUB_TOKEN. The publish jobs
# push to external registries via their own secrets, not the GITHUB_TOKEN, so
# they need no repo write. The jobs that genuinely write through the
# GITHUB_TOKEN (github-release, node-/wasm-publish provenance, attestations)
# declare those rights in their own job-level permissions blocks.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Network-flake resilience: retry transient registry/DNS failures at the tool
  # level so a blip fetching crates.io / npm inside any build or publish step
  # retries automatically instead of failing the job.
  CARGO_NET_RETRY: "10"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  npm_config_fetch_retries: "5"
  npm_config_fetch_retry_maxtimeout: "120000"
  PIP_RETRIES: "5"
  PIP_DEFAULT_TIMEOUT: "120"

jobs:
  # --------------------------------------------------------------------------
  # The gate. Two jobs in one, both about not publishing something by accident.
  #
  # Ref guard: `workflow_dispatch` accepts any ref, so a dispatch from main would
  # have run the whole pipeline and published whatever main happened to contain,
  # under a version string taken from a manifest rather than from a tag. Every
  # publish job now sits behind this, and it refuses anything that is not a v*
  # tag.
  #
  # Build gate: without it each publish job depended only on the artefacts it
  # needed, so a failing wheel build stopped PyPI and left crates.io, npm and
  # NuGet to publish anyway. A release that lands on four registries out of seven
  # cannot be rolled back -- the versions are burned. Publishing now begins only
  # once every build has succeeded.
  # --------------------------------------------------------------------------
  gate:
    name: Verify the ref and gate every publish
    timeout-minutes: 45 # above the 30-minute CI wait below, not a budget
    needs: [python-wheels, python-sdist, node-build, cli-binaries, c-abi-build]
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
    permissions:
      contents: read
      checks: read
    steps:
      - id: check
        shell: bash
        run: |
          set -euo pipefail
          # The ref, not the ref name: a branch called v1 would pass a name test.
          case "${GITHUB_REF}" in
            refs/tags/v[0-9]*) ;;
            *)
              echo "::error::release runs from a v* tag only; got '${GITHUB_REF}'."
              exit 1
              ;;
          esac
          echo "tag=${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
          echo "version=${GITHUB_REF_NAME#v}" >> "${GITHUB_OUTPUT}"
          echo "::notice::ref accepted: ${GITHUB_REF}"

      # ci.yml does not fire on a tag push, so the CI that matters is the run on
      # this commit from when it was on main. Reading it is the point; reading it
      # *correctly* is the subtlety. A run still in progress is not a failed run,
      # and treating the two alike refuses correct tags. So this waits for a
      # decision and fails only on one that went against us.
      - name: Wait for CI on this commit to decide
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          deadline=$(( SECONDS + 1800 ))
          while :; do
            # Exclude this workflow's own checks; they cannot be finished while
            # this step is what is running.
            states=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" \
                       --paginate --jq '.check_runs[]
                         | select(.name | test("Release|gate|Attest|Publish|Mirror") | not)
                         | "\(.status) \(.conclusion)"' || true)
            if [ -z "${states}" ]; then
              echo "::notice::no other check runs on ${GITHUB_SHA}; nothing to wait for."
              break
            fi
            pending=$(printf '%s\n' "${states}" | grep -cE '^(queued|in_progress)' || true)
            failed=$(printf '%s\n' "${states}" \
                       | grep -E '^completed' \
                       | grep -cE '(failure|timed_out|cancelled)$' || true)
            if [ "${failed}" -gt 0 ]; then
              echo "::error::CI on ${GITHUB_SHA} has ${failed} failed check(s); refusing to publish."
              printf '%s\n' "${states}"
              exit 1
            fi
            if [ "${pending}" -eq 0 ]; then
              echo "::notice::CI on ${GITHUB_SHA} is decided and green."
              break
            fi
            if [ "${SECONDS}" -ge "${deadline}" ]; then
              echo "::error::CI on ${GITHUB_SHA} still undecided after 30 minutes (${pending} pending)."
              exit 1
            fi
            echo "${pending} check(s) still running; waiting 30s..."
            sleep 30
          done
          echo "::notice::gate open for ${GITHUB_REF_NAME}; every build succeeded."

  # --------------------------------------------------------------------------
  # crates.io: strategy-ci-core, then the wickra-strategy-ci crate (which carries
  # the CLI binary of the same name). The directory is crates/strategy-ci-cli; the
  # package is not.
  # --------------------------------------------------------------------------
  cargo-publish:
    name: Publish to crates.io
    needs: gate
    timeout-minutes: 45
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Idempotent publishing: if the version is already on crates.io we treat
      # that as success so re-runs of the workflow do not fail.
      - name: Publish strategy-ci-core (idempotent)
        run: |
          if out=$(cargo publish -p strategy-ci-core --token "$CARGO_REGISTRY_TOKEN" 2>&1); then
            echo "$out"
          elif echo "$out" | grep -q "already uploaded\|already exists"; then
            echo "skip: already published"
          else
            echo "$out"
            exit 1
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index to refresh
        run: sleep 45

      - name: Publish wickra-strategy-ci (idempotent)
        run: |
          if out=$(cargo publish -p wickra-strategy-ci --token "$CARGO_REGISTRY_TOKEN" 2>&1); then
            echo "$out"
          elif echo "$out" | grep -q "already uploaded\|already exists"; then
            echo "skip: already published"
          else
            echo "$out"
            exit 1
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # Produce .crate files for the GitHub Release attachments.
      - name: Build .crate files for release attachment
        run: |
          cargo package -p strategy-ci-core
          cargo package -p wickra-strategy-ci

      - name: Upload .crate files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crate-files
          path: target/package/*.crate

      # CycloneDX SBOM per published crate.
      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: cargo-cyclonedx

      - name: Generate CycloneDX SBOMs
        run: |
          cargo cyclonedx --format json --top-level
          mkdir -p sboms
          cp crates/strategy-ci-core/strategy-ci-core.cdx.json sboms/
          cp crates/strategy-ci-cli/wickra-strategy-ci.cdx.json sboms/
          ls -lh sboms/

      - name: Upload SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sboms
          path: sboms/*.cdx.json

  # --------------------------------------------------------------------------
  # PyPI: cross-platform wheels + sdist
  # --------------------------------------------------------------------------
  python-wheels:
    name: Build wheels (${{ matrix.target }}/${{ matrix.manylinux }} on ${{ matrix.os }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto }
          - { os: ubuntu-latest, target: aarch64, manylinux: auto }
          - { os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { os: ubuntu-latest, target: aarch64, manylinux: musllinux_1_2 }
          - { os: macos-latest, target: x86_64, manylinux: auto }
          - { os: macos-latest, target: aarch64, manylinux: auto }
          - { os: windows-latest, target: x64, manylinux: auto }
          - { os: windows-11-arm, target: aarch64, manylinux: auto }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Sync root README into bindings/python so it ships with the wheel
        shell: bash
        run: cp README.md bindings/python/README.md
      # The Python binding depends only on strategy-ci-core (pure canonicalization +
      # hashing, no native networking), so the manylinux/musllinux containers
      # build the wheel with no extra system dependencies.
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: bindings/python
          target: ${{ matrix.target }}
          args: --release --strip --out dist
          manylinux: ${{ matrix.manylinux }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux }}
          path: bindings/python/dist/*

  python-sdist:
    name: Build Python sdist
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sync root README into bindings/python so it ships in the sdist
        run: cp README.md bindings/python/README.md
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: bindings/python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-sdist
          path: bindings/python/dist/*

  python-publish:
    name: Publish to PyPI
    timeout-minutes: 45
    needs: [gate, python-wheels, python-sdist]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true
      - name: Upload to PyPI
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: upload
          args: --skip-existing dist/*
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

  # --------------------------------------------------------------------------
  # npm: per-platform native binaries + main meta-package
  # --------------------------------------------------------------------------
  node-build:
    name: Node build (${{ matrix.target }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { host: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { host: macos-latest, target: x86_64-apple-darwin }
          - { host: macos-latest, target: aarch64-apple-darwin }
          - { host: windows-latest, target: x86_64-pc-windows-msvc }
          - { host: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # npm install (not ci): the per-platform optionalDependencies are not yet
      # published, so they are absent from the lock and npm ci would reject it.
      - name: Install Node deps
        run: cd bindings/node && npm install --no-audit --no-fund
      - name: Build native module
        working-directory: bindings/node
        run: npx napi build --platform --release --target ${{ matrix.target }}
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bindings-${{ matrix.target }}
          path: bindings/node/wickra-strategy-ci.*.node
          if-no-files-found: error

  node-publish:
    name: Publish to npm
    timeout-minutes: 45
    needs: [gate, node-build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # Sigstore provenance from the GitHub OIDC token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Install Node deps
        run: cd bindings/node && npm install --no-audit --no-fund
      - name: Download all platform binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: bindings/node/artifacts
          pattern: bindings-*
      # The npm/<platform>/package.json templates are committed (bindings/node/npm/),
      # so `napi artifacts` only drops the freshly built .node binary into the
      # matching directory. napi-rs CLI 3 renamed `--dir` to `--output-dir`.
      - name: Move binaries into platform package layout
        working-directory: bindings/node
        run: npx napi artifacts --output-dir artifacts

      # Every published package must carry the licence texts it claims. The
      # manifests name MIT and Apache-2.0, but an SPDX expression is a reference
      # to two documents, not the documents: a tarball that ships the expression
      # alone leaves whoever installs it with terms they have to go and find.
      #
      # npm packs from the working tree, so the copies are staged here rather
      # than committed. `npm pack --dry-run` then proves they will actually be
      # in the tarball -- a `files` entry is a claim, and this is the check that
      # the claim holds for all seven packages before any of them is published.
      - name: Stage the licence texts and prove they will be packed
        working-directory: bindings/node
        run: |
          set -euo pipefail
          for dir in . npm/*/; do
            cp ../../LICENSE-MIT ../../LICENSE-APACHE "$dir/"
          done
          for dir in . npm/*/; do
            # The ${...} below are JavaScript template literals inside a
            # single-quoted node script, not shell expansions.
            # shellcheck disable=SC2016
            ( cd "$dir" && npm pack --dry-run --json ) | node -e '
              const chunks = [];
              process.stdin.on("data", c => chunks.push(c));
              process.stdin.on("end", () => {
                const pkg = JSON.parse(chunks.join(""))[0];
                const names = pkg.files.map(f => f.path);
                const missing = ["LICENSE-MIT", "LICENSE-APACHE"].filter(n => !names.includes(n));
                if (missing.length) {
                  console.error(`::error::${pkg.name} would publish without ${missing.join(" and ")}`);
                  process.exit(1);
                }
                console.log(`${pkg.name}: licence texts present`);
              });'
          done

      - name: Publish platform packages (idempotent)
        working-directory: bindings/node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set +e
          version=$(node -p "require('./package.json').version")
          fail=0
          publish_dir() {
            local dir=$1
            local pkg
            pkg=$(basename "$dir")
            local pkgname="wickra-strategy-ci-$pkg"
            local existing
            existing=$(npm view "$pkgname@$version" version 2>/dev/null)
            if [ "$existing" = "$version" ]; then
              echo "::notice::skip $pkgname@$version (already on npm)"
              return 0
            fi
            echo "::group::publish $pkgname@$version"
            (cd "$dir" && npm publish --access public --ignore-scripts --provenance)
            local rc=$?
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              echo "::warning::first attempt of $pkgname failed (rc=$rc); retrying after 30s"
              sleep 30
              (cd "$dir" && npm publish --access public --ignore-scripts --provenance)
              rc=$?
            fi
            if [ "$rc" -ne 0 ]; then
              echo "::error::$pkgname could not be published — the release would land with a missing platform binary; failing the job."
              return 1
            fi
            return 0
          }
          for dir in npm/*/; do
            publish_dir "$dir" || fail=1
          done
          exit $fail

      - name: Sync root README into bindings/node so it ships with the npm tarball
        shell: bash
        run: cp ../../README.md README.md
        working-directory: bindings/node

      - name: Publish main package to npm (idempotent)
        working-directory: bindings/node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set +e
          version=$(node -p "require('./package.json').version")
          existing=$(npm view "wickra-strategy-ci@$version" version 2>/dev/null)
          if [ "$existing" = "$version" ]; then
            echo "::notice::skip wickra-strategy-ci@$version (already on npm)"
            exit 0
          fi
          npm publish --access public --ignore-scripts --provenance
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning::first attempt failed (rc=$rc); retrying after 30s"
            sleep 30
            npm publish --access public --ignore-scripts --provenance
            rc=$?
          fi
          exit $rc

      - name: Pack node tarballs for release attachment
        working-directory: bindings/node
        run: |
          npm pack --ignore-scripts
          for d in npm/*/; do
            (cd "$d" && npm pack --ignore-scripts)
          done

      - name: Upload Node tarballs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: node-tarballs
          path: |
            bindings/node/*.tgz
            bindings/node/npm/*/*.tgz

  # --------------------------------------------------------------------------
  # WASM: wasm-pack build + npm publish (as `wickra-strategy-ci-wasm`)
  # --------------------------------------------------------------------------
  wasm-publish:
    name: Publish wickra-strategy-ci-wasm to npm
    needs: gate
    timeout-minutes: 45
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # Sigstore provenance from the GitHub OIDC token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install wasm-pack (latest, via prebuilt binary)
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: wasm-pack
      - name: Build WASM package (bundler target)
        run: wasm-pack build bindings/wasm --target bundler --release
      # The manifest here is generated by wasm-pack, not committed, so the
      # licence texts cannot be handled the way the other seven npm packages
      # handle them (a `files` entry in a manifest under review). wasm-pack says
      # so itself while building: "License key is set in Cargo.toml but no
      # LICENSE file(s) were found". Without this the package would publish
      # declaring MIT OR Apache-2.0 and carrying neither document.
      - name: Enrich generated package.json and stage the licence texts
        working-directory: bindings/wasm/pkg
        run: |
          set -euo pipefail
          cp ../../../LICENSE-MIT ../../../LICENSE-APACHE .
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json'));
            pkg.author = 'kingchenc <support@wickra.org>';
            pkg.repository = { type: 'git', url: 'https://github.com/wickra-lib/wickra-strategy-ci' };
            pkg.homepage = 'https://github.com/wickra-lib/wickra-strategy-ci';
            pkg.bugs = { url: 'https://github.com/wickra-lib/wickra-strategy-ci/issues' };
            pkg.license = 'MIT OR Apache-2.0';
            pkg.files = [...new Set([...(pkg.files || []), 'LICENSE-MIT', 'LICENSE-APACHE'])];
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      # A `files` entry is a claim; this is the check that it holds, and it runs
      # before the publish rather than after it.
      - name: Prove the licence texts will be packed
        working-directory: bindings/wasm/pkg
        run: |
          set -euo pipefail
          # The ${...} below are JavaScript template literals inside a
          # single-quoted node script, not shell expansions.
          # shellcheck disable=SC2016
          npm pack --dry-run --json | node -e '
            const chunks = [];
            process.stdin.on("data", c => chunks.push(c));
            process.stdin.on("end", () => {
              const pkg = JSON.parse(chunks.join(""))[0];
              const names = pkg.files.map(f => f.path);
              const missing = ["LICENSE-MIT", "LICENSE-APACHE"].filter(n => !names.includes(n));
              if (missing.length) {
                console.error(`::error::${pkg.name} would publish without ${missing.join(" and ")}`);
                process.exit(1);
              }
              console.log(`${pkg.name}: licence texts present`);
            });'

      - name: Pack wickra-strategy-ci-wasm for release attachment
        working-directory: bindings/wasm/pkg
        run: npm pack
      - name: Upload WASM tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wasm-tarball
          path: bindings/wasm/pkg/wickra-strategy-ci-wasm-*.tgz
      - name: Publish wickra-strategy-ci-wasm to npm (idempotent)
        working-directory: bindings/wasm/pkg
        run: |
          if out=$(npm publish --access public --provenance 2>&1); then
            echo "$out"
          elif echo "$out" | grep -q "You cannot publish over"; then
            echo "skip: version already on npm"
          else
            echo "$out"
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # --------------------------------------------------------------------------
  # CLI binaries: build the wickra-strategy-ci executable per platform on a native
  # runner and attach it to the GitHub Release (in addition to `cargo install`).
  # --------------------------------------------------------------------------
  cli-binaries:
    name: CLI binary (${{ matrix.target }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { host: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { host: macos-latest, target: x86_64-apple-darwin }
          - { host: macos-latest, target: aarch64-apple-darwin }
          - { host: windows-latest, target: x86_64-pc-windows-msvc }
          - { host: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build the CLI binary
        run: cargo build -p wickra-strategy-ci --release --target ${{ matrix.target }}
      - name: Package the binary
        shell: bash
        run: |
          set -e
          dir="wickra-strategy-ci-${{ matrix.target }}"
          mkdir -p "$dir"
          bin="target/${{ matrix.target }}/release/wickra-strategy-ci"
          if [ -f "$bin.exe" ]; then
            cp "$bin.exe" "$dir/"
          else
            cp "$bin" "$dir/"
          fi
          cp README.md LICENSE-MIT LICENSE-APACHE "$dir/"
          tar -czf "$dir.tar.gz" "$dir"
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-${{ matrix.target }}
          path: wickra-strategy-ci-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # C ABI native libraries (bindings/c) — built per target, attached to the
  # GitHub Release and consumed by the C#, Java and Go publish jobs.
  # --------------------------------------------------------------------------
  c-abi-build:
    name: C ABI library (${{ matrix.target }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { host: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { host: macos-latest, target: x86_64-apple-darwin }
          - { host: macos-latest, target: aarch64-apple-darwin }
          - { host: windows-latest, target: x86_64-pc-windows-msvc }
          - { host: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build the C ABI library (cdylib + staticlib)
        run: cargo build -p wickra-strategy-ci-c --release --target ${{ matrix.target }}
      - name: Package header + libraries
        shell: bash
        run: |
          set -e
          dir="wickra-strategy-ci-c-${{ matrix.target }}"
          mkdir -p "$dir/include" "$dir/lib"
          cp bindings/c/include/wickra_strategy_ci.h "$dir/include/"
          for f in libwickra_strategy_ci.so libwickra_strategy_ci.a libwickra_strategy_ci.dylib wickra_strategy_ci.dll wickra_strategy_ci.dll.lib wickra_strategy_ci.lib; do
            src="target/${{ matrix.target }}/release/$f"
            [ -f "$src" ] && cp "$src" "$dir/lib/"
          done
          tar -czf "$dir.tar.gz" "$dir"
          echo "packaged $dir:"; ls -lR "$dir"
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: c-abi-${{ matrix.target }}
          path: wickra-strategy-ci-c-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  # Pack and publish the .NET binding to NuGet. Authentication uses NuGet Trusted
  # Publishing (OIDC) — no long-lived API key. Configure the trusted-publishing
  # policy on nuget.org (owner KingchenC, repo wickra-lib/wickra-strategy-ci,
  # workflow release.yml) for the Wickra.StrategyCi package.
  csharp-publish:
    name: Publish to NuGet
    timeout-minutes: 45
    needs: [gate, c-abi-build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # GitHub OIDC token for trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the C ABI native libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: c-abi-*
          path: c-abi-artifacts
      - name: Stage native libraries into runtimes/<rid>/native
        shell: bash
        run: |
          set -e
          declare -A RID=(
            [x86_64-unknown-linux-gnu]=linux-x64
            [aarch64-unknown-linux-gnu]=linux-arm64
            [x86_64-apple-darwin]=osx-x64
            [aarch64-apple-darwin]=osx-arm64
            [x86_64-pc-windows-msvc]=win-x64
            [aarch64-pc-windows-msvc]=win-arm64
          )
          base=bindings/csharp/WickraStrategyCi/runtimes
          for target in "${!RID[@]}"; do
            archive=$(find c-abi-artifacts -name "wickra-strategy-ci-c-$target.tar.gz" | head -1)
            if [ -z "$archive" ]; then
              echo "::error::missing native artifact for $target"; exit 1
            fi
            tmp=$(mktemp -d); tar -xzf "$archive" -C "$tmp"
            dest="$base/${RID[$target]}/native"; mkdir -p "$dest"
            for f in libwickra_strategy_ci.so libwickra_strategy_ci.dylib wickra_strategy_ci.dll; do
              src=$(find "$tmp" -name "$f" | head -1)
              [ -n "$src" ] && cp "$src" "$dest/"
            done
            echo "staged ${RID[$target]}:"; ls -l "$dest"
          done
      - name: Pack
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 15
          max_attempts: 2
          retry_wait_seconds: 20
          shell: bash
          command: |
            version="${GITHUB_REF_NAME#v}"
            dotnet pack bindings/csharp/WickraStrategyCi/WickraStrategyCi.csproj -c Release -p:Version="$version" -o nupkg
      - name: NuGet login (OIDC -> temporary API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget_login
        with:
          user: KingchenC
      - name: Push to NuGet
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "nupkg/*.nupkg" --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Upload the NuGet package as a build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-package
          path: nupkg/*.nupkg
          if-no-files-found: error

  # Publish the Java binding to Maven Central. The org.wickra namespace is
  # verified; auth uses the Sonatype Central token (CENTRAL_USERNAME /
  # CENTRAL_PASSWORD) and artifacts are GPG-signed (GPG_PRIVATE_KEY /
  # GPG_PASSPHRASE). The pom version must match the release tag.
  java-publish:
    name: Publish to Maven Central
    timeout-minutes: 45
    needs: [gate, c-abi-build]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the C ABI native libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: c-abi-*
          path: c-abi-artifacts
      - name: Stage native libraries into resources/native/<os>-<arch>
        shell: bash
        run: |
          set -e
          declare -A PLAT=(
            [x86_64-unknown-linux-gnu]=linux-x64
            [aarch64-unknown-linux-gnu]=linux-arm64
            [x86_64-apple-darwin]=osx-x64
            [aarch64-apple-darwin]=osx-arm64
            [x86_64-pc-windows-msvc]=win-x64
            [aarch64-pc-windows-msvc]=win-arm64
          )
          base=bindings/java/src/main/resources/native
          for target in "${!PLAT[@]}"; do
            archive=$(find c-abi-artifacts -name "wickra-strategy-ci-c-$target.tar.gz" | head -1)
            if [ -z "$archive" ]; then
              echo "::error::missing native artifact for $target"; exit 1
            fi
            tmp=$(mktemp -d); tar -xzf "$archive" -C "$tmp"
            dest="$base/${PLAT[$target]}"; mkdir -p "$dest"
            for f in libwickra_strategy_ci.so libwickra_strategy_ci.dylib wickra_strategy_ci.dll; do
              src=$(find "$tmp" -name "$f" | head -1)
              [ -n "$src" ] && cp "$src" "$dest/"
            done
            echo "staged ${PLAT[$target]}:"; ls -l "$dest"
          done
      - name: Set up JDK 25 + Maven Central credentials + GPG
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE
      - name: Deploy to Maven Central
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B -f bindings/java -Prelease deploy -DskipTests

      # The JAR reached Maven Central and nowhere else, so the GitHub Release
      # listed every other artefact and not this one. Anyone pinning a release by
      # its assets had no Java artefact to check against.
      - name: Upload the Maven artefacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: java-artifacts
          path: |
            bindings/java/target/*.jar
            bindings/java/target/*.jar.asc
          if-no-files-found: error

  # Mirror the in-repo Go module (bindings/go) to the standalone
  # wickra-strategy-ci-go repository so `go get
  # github.com/wickra-lib/wickra-strategy-ci-go` builds with no extra steps. The
  # in-repo module keeps the prebuilt libraries git-ignored; the mirror commits
  # them per platform under lib/<goos>_<goarch>/ alongside the vendored header.
  # Independent of the GitHub-release job so a Go hiccup never blocks the C/C++
  # asset release. The push uses a fine-grained PAT (GO_MIRROR_TOKEN,
  # contents:write on wickra-strategy-ci-go); the mirror is a derived artifact,
  # so its bot commit is intentionally unsigned.
  go-mirror:
    name: Mirror the Go module to wickra-strategy-ci-go
    timeout-minutes: 45 # backstop only: release build/publish jobs compile from source (vendored OpenSSL) and must not be killed mid-build; far above the ~10 min real runtime
    needs: [gate, c-abi-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the C ABI native libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: c-abi-*
          path: c-abi-artifacts

      - name: Assemble the wickra-strategy-ci-go module tree
        shell: bash
        run: |
          set -e
          out=wickra-strategy-ci-go-module
          mkdir -p "$out/include" "$out/lib"
          # Single-package Go source + vendored C ABI header. Test files are
          # deliberately excluded: they read the golden/ corpus from above the
          # module, which exists in this repository and nowhere in a consumer's
          # module cache, so shipping them makes `go test ./...` fail for anyone
          # who depends on the mirror.
          for f in bindings/go/*.go; do
            case "$f" in *_test.go) continue ;; esac
            cp "$f" "$out/"
          done
          cp bindings/go/include/wickra_strategy_ci.h "$out/include/"
          cp bindings/go/README.md "$out/"
          # Ship the dual license so pkg.go.dev detects a redistributable license.
          cp LICENSE-MIT LICENSE-APACHE "$out/"
          # Standalone module path (the in-repo go.mod points at the subdir).
          printf 'module github.com/wickra-lib/wickra-strategy-ci-go\n\ngo 1.23\n' > "$out/go.mod"
          # Point install instructions at the standalone module path.
          sed -i 's#github.com/wickra-lib/wickra-strategy-ci/bindings/go#github.com/wickra-lib/wickra-strategy-ci-go#g' \
            "$out/README.md" "$out"/*.go
          # Stage each prebuilt library under lib/<goos>_<goarch>/ (committed in
          # the mirror, unlike the in-repo lib/.gitignore). "<dir> <libfile>".
          declare -A GO=(
            [x86_64-unknown-linux-gnu]="linux_amd64 libwickra_strategy_ci.so"
            [aarch64-unknown-linux-gnu]="linux_arm64 libwickra_strategy_ci.so"
            [x86_64-apple-darwin]="darwin_amd64 libwickra_strategy_ci.dylib"
            [aarch64-apple-darwin]="darwin_arm64 libwickra_strategy_ci.dylib"
            [x86_64-pc-windows-msvc]="windows_amd64 wickra_strategy_ci.dll"
            [aarch64-pc-windows-msvc]="windows_arm64 wickra_strategy_ci.dll"
          )
          for target in "${!GO[@]}"; do
            read -r dir libfile <<< "${GO[$target]}"
            archive=$(find c-abi-artifacts -name "wickra-strategy-ci-c-$target.tar.gz" | head -1)
            if [ -z "$archive" ]; then
              echo "::error::missing native artifact for $target"; exit 1
            fi
            tmp=$(mktemp -d); tar -xzf "$archive" -C "$tmp"
            src=$(find "$tmp" -name "$libfile" | head -1)
            if [ -z "$src" ]; then
              echo "::error::missing $libfile for $target"; exit 1
            fi
            mkdir -p "$out/lib/$dir"; cp "$src" "$out/lib/$dir/"
          done
          echo "assembled module:"; find "$out" -type f | sort

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"
          cache: false

      # Nothing built the assembled tree before it was pushed and tagged. A Go
      # tag is immutable on the module proxy, so a mirror that does not compile
      # is permanent: the only remedy is a new version. This builds it exactly
      # as a consumer would -- cgo against the staged linux_amd64 library, from
      # the module directory itself, with no repository above it.
      - name: Prove the assembled module compiles
        working-directory: wickra-strategy-ci-go-module
        shell: bash
        run: |
          set -euo pipefail
          go build ./...
          go vet ./...
          echo "::notice::the mirrored module compiles"

      - name: Push to wickra-strategy-ci-go and tag the release
        shell: bash
        env:
          MIRROR_TOKEN: ${{ secrets.GO_MIRROR_TOKEN }}
        run: |
          set -e
          version="${GITHUB_REF_NAME#v}"
          remote="https://x-access-token:${MIRROR_TOKEN}@github.com/wickra-lib/wickra-strategy-ci-go.git"
          git clone -q "$remote" mirror-repo
          cd mirror-repo
          git config user.name "wickra-bot"
          git config user.email "support@wickra.org"
          git symbolic-ref HEAD refs/heads/main
          # Replace all tracked content with the freshly assembled tree.
          find . -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
          cp -r ../wickra-strategy-ci-go-module/. .
          git add -A
          if git diff --cached --quiet; then
            echo "wickra-strategy-ci-go already up to date; tagging only"
          else
            git -c commit.gpgsign=false commit -q -m "Release v$version"
          fi
          git push origin HEAD:refs/heads/main
          git tag "v$version"
          git push origin "v$version"

  # --------------------------------------------------------------------------
  # GitHub Release: create a DRAFT, attach every built artefact, then publish-
  # release flips it to published (immutability-ready ordering).
  # --------------------------------------------------------------------------
  github-release:
    name: Attach assets to the draft GitHub Release
    timeout-minutes: 45
    # Every producer, not just some. csharp-publish, java-publish and go-mirror
    # were missing, so their artefacts could fail to publish while the release
    # went out reporting success.
    needs: [cargo-publish, python-publish, node-publish, wasm-publish, cli-binaries,
            c-abi-build, csharp-publish, java-publish, go-mirror]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve target tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "push" ] && [[ "$REF" == refs/tags/* ]]; then
            tag="$REF_NAME"
          else
            tag=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          fi
          if [ -z "$tag" ]; then
            echo "::error::no v* tag found to attach assets to"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "::notice::attaching assets to release $tag"
      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: Stage release assets
        run: |
          set -e
          mkdir -p release-assets
          find artifacts -type f -name "*.whl" -exec cp {} release-assets/ \;
          find artifacts -type f -name "*.tar.gz" -exec cp {} release-assets/ \;
          find artifacts -type f -name "*.node" -exec cp {} release-assets/ \;
          find artifacts -type f -name "wickra-strategy-ci-*.tgz" -exec cp {} release-assets/ \;
          find artifacts -type f -name "*.crate" -exec cp {} release-assets/ \;
          find artifacts -type f -name "*.cdx.json" -exec cp {} release-assets/ \;
          find artifacts -type f -name "*.nupkg" -exec cp {} release-assets/ \;
          find artifacts -type f -name "*.jar" -exec cp {} release-assets/ \;
          find artifacts -type f -name "*.jar.asc" -exec cp {} release-assets/ \;
          ls -lh release-assets/
          echo "asset-count=$(find release-assets/ -type f | wc -l)"

      # Rendered from .github/release-notes.md rather than inlined here. The
      # template shows how to reference the composite action, and such an example
      # inside a workflow file is indistinguishable from a real step to anything
      # auditing for unpinned actions.
      - name: Compose the release notes
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          # Drop the template's own HTML comment header (it documents the
          # template, not the release), then substitute only TAG and VERSION so
          # any other shell-looking text passes through untouched.
          #
          # The single quotes are the point: envsubst takes the literal *names*
          # of the only two variables it may expand. Expand them in the shell
          # and it is handed the values, substitutes nothing, and the template
          # ships with its placeholders intact.
          # shellcheck disable=SC2016
          sed '/^<!--/,/^-->/d' .github/release-notes.md \
            | envsubst '${TAG} ${VERSION}' > release-notes.md
          # A template that still carries an unsubstituted placeholder would ship
          # "${TAG}" verbatim into the published notes.
          #
          # The pattern is a literal '${', named once here so the searches below
          # can quote it normally. Let the shell expand it instead and both greps
          # would look for the empty string, match every line, and turn this
          # guard into an unconditional failure.
          # shellcheck disable=SC2016
          placeholder='\${'
          if grep -q "$placeholder" release-notes.md; then
            echo "::error::release-notes.md still contains an unsubstituted placeholder:"
            grep -n "$placeholder" release-notes.md
            exit 1
          fi
          head -1 release-notes.md

      - name: Create / update the draft GitHub Release with assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: wickra-strategy-ci ${{ steps.tag.outputs.tag }}
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: false
          draft: true
          body_path: release-notes.md
  # --------------------------------------------------------------------------
  # Build provenance attestations
  # --------------------------------------------------------------------------
  attestations:
    name: Attest build provenance
    timeout-minutes: 45
    needs: [cargo-publish, python-wheels, python-sdist, github-release,
            csharp-publish, java-publish, c-abi-build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: write
    steps:
      - name: Download crate files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: crate-files
          path: artifacts/crates
      - name: Download wheels + sdist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          path: artifacts/python
          merge-multiple: true
      # Provenance covered the crates and the Python artefacts only, so the
      # NuGet package, the Maven JAR and the six C ABI libraries shipped with
      # nothing a consumer could verify them against -- and those are precisely
      # the artefacts that are native binaries rather than source.
      - name: Download the NuGet package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-package
          path: artifacts/nuget
      - name: Download the Maven artefacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: java-artifacts
          path: artifacts/java
      - name: Download the C ABI libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: c-abi-*
          path: artifacts/c-abi
          merge-multiple: true
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/crates/*.crate
            artifacts/python/*.whl
            artifacts/python/*.tar.gz
            artifacts/nuget/*.nupkg
            artifacts/java/*.jar
            artifacts/c-abi/*.tar.gz
      - name: Attach provenance bundle to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.github-release.outputs.tag }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          if [ -z "$TAG" ]; then
            echo "::error::no tag resolved from github-release; cannot attach provenance."
            exit 1
          fi
          if [ -z "$BUNDLE" ] || [ ! -f "$BUNDLE" ]; then
            echo "::error::attestation bundle not found at '$BUNDLE'."
            exit 1
          fi
          dest="wickra-strategy-ci-${TAG}.provenance.intoto.jsonl"
          cp "$BUNDLE" "$dest"
          echo "Uploading $dest to release $TAG"
          gh release upload "$TAG" "$dest" --clobber --repo "${{ github.repository }}"

  # --------------------------------------------------------------------------
  # Publish the drafted release LAST (immutability-ready).
  # --------------------------------------------------------------------------
  publish-release:
    name: Publish the GitHub Release
    timeout-minutes: 45
    needs: [github-release, attestations]
    if: always() && needs.github-release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Flip the draft release to published (latest)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.github-release.outputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            echo "::error::no tag resolved from github-release; cannot publish."
            exit 1
          fi
          echo "::notice::publishing release $TAG (draft -> published, latest)"
          gh release edit "$TAG" --draft=false --latest --repo "${{ github.repository }}"

  # --------------------------------------------------------------------------
  # Move the major-version tag to this release, so a workflow referencing the
  # action as `@vN` picks up patch and minor updates. Note what N is: the tag is
  # derived from the release, so v0.1.0 yields v0, not v1. Pre-1.0 that tag
  # floats across minor versions which are allowed to break, which is why the
  # release notes above quote the exact tag instead.
  # Runs only after the release is published successfully.
  # --------------------------------------------------------------------------
  major-tag:
    name: Move the @vN major tag
    timeout-minutes: 15
    needs: publish-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Moving a ref needs no working tree and no git credentials: the API does
      # it directly. This was the one checkout in the repository that kept the
      # token in the runner's git config for the whole job, and it kept it only
      # to run a single `git push`.
      - name: Move the major tag to the release commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          major="v${GITHUB_REF_NAME#v}"; major="${major%%.*}"   # v1.2.3 -> v1
          ref="tags/${major}"

          # PATCH moves an existing ref; the first release of a major has none
          # yet, so a 404 there means create it rather than fail.
          if gh api "repos/${GITHUB_REPOSITORY}/git/refs/${ref}" --silent 2>/dev/null; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/${ref}" \
              -f sha="${GITHUB_SHA}" -F force=true --silent
            echo "::notice::moved ${major} to ${GITHUB_SHA}"
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/${ref}" -f sha="${GITHUB_SHA}" --silent
            echo "::notice::created ${major} at ${GITHUB_SHA}"
          fi

# CodeQL analysis configuration, referenced from .github/workflows/codeql.yml.
#
# `bindings/node/src/lib.rs` is excluded from analysis. The file is a thin
# napi-derive wrapper over strategy-ci-core: the `Session` class and its
# `command` / `version` methods, each a one-line delegation.
#
# napi-derive expands every `#[napi]` into FFI glue that dereferences raw
# `napi_env` and `napi_value` handles, and CodeQL attributes that generated code
# back to the source span of the macro. The result is a
# `rust/access-invalid-pointer` finding per exported class, anchored on a struct
# identifier rather than on any pointer expression.
#
# `query-filters` matches on query id, tags and severity only — it cannot be
# scoped to a path. Excluding the rule that way would also disable it for
# `bindings/c/src`, which is where this workspace's real raw-pointer code lives:
# the handle protocol, the caller-supplied output buffer and its length check.
# Dropping the one file of generated glue keeps the rule active everywhere it can
# say something useful.
#
# The rule for adding to this list: a path belongs here when a generator owns the
# file end to end, never because a finding in it was inconvenient.
paths-ignore:
  - bindings/node/src/lib.rs

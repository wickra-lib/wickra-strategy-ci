# cargo-deny configuration — supply-chain gate (advisories, licenses, bans, sources).

[advisories]
version = 2
yanked = "deny"
# Suppressed advisories (assessed as not affecting wickra-strategy-ci). Keep in
# lock-step with osv-scanner.toml.
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
]
confidence-threshold = 0.93

# No scoped license exceptions. The runner opens no network connections, so no
# TLS stack and no CA-bundle crate enters the graph; every dependency is covered
# by the allow-list above. Add an entry here only with the crate, its licence and
# the reason it is pulled in.
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# The exchange facade is consumed as a git dependency until its first crates.io
# release; it lives under the project's own GitHub org.
[sources.allow-org]
github = ["wickra-lib"]

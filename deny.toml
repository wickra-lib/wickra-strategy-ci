# cargo-deny configuration — supply-chain gate (advisories, licenses, bans, sources).

[advisories]
version = 2
yanked = "deny"
# Suppressed advisories (assessed as not affecting wickra-strategy-ci). Keep in
# lock-step with osv-scanner.toml.
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
]
confidence-threshold = 0.93

# No scoped license exceptions. The runner opens no network connections, so no
# TLS stack and no CA-bundle crate enters the graph; every dependency is covered
# by the allow-list above. Add an entry here only with the crate, its licence and
# the reason it is pulled in.
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# There is deliberately no [sources.allow-org] exemption. Every dependency,
# Wickra's own included, comes from crates.io at an exact version. A git source
# cannot be published -- `cargo publish` resolves optional dependencies too --
# and it ages silently: a rev never goes red, it only gets older, which is how
# this workspace ended up testing against an engine 130 commits and five
# releases behind the one its users would resolve. With no exemption here,
# `unknown-git = "deny"` fails the build the moment one comes back.
